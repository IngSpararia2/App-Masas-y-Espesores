name: masalab_historico
description: Aplicación offline para importar históricos de compresión y flexotracción y estimar masas coherentes.
publish_to: "none"
version: 0.1.5+6

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: 3.0.7
  archive: 3.6.1
  file_selector: 1.1.0
  path: 1.9.1
  path_provider: 2.1.6
  sqlite3: 3.5.0
  xml: 6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon_source.png
    - assets/branding/splash_logo.png
